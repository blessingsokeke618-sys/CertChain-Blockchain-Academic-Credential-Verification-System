name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

    
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  lint-and-test:
    name: Frontend Lint, Tests & Coverage
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Vitest Unit Tests with Coverage
        run: npm run test -- --coverage

      - name: Enforce Minimum Coverage
        run: |
          node -e "
          const fs = require('fs');
          const path = 'coverage/coverage-summary.json';
          if (!fs.existsSync(path)) { console.error('Coverage summary missing'); process.exit(1); }
          const summary = JSON.parse(fs.readFileSync(path, 'utf8'));
          const { lines, statements, branches, functions } = summary.total;
          console.log('Global coverage:', { lines: lines.pct, statements: statements.pct, branches: branches.pct, functions: functions.pct });
          const globalThreshold = 60;
          let failed = false;
          for (const [metric, data] of Object.entries({ lines, statements, branches, functions })) {
            if (data.pct < globalThreshold) {
              console.error('Global ' + metric + ' coverage ' + data.pct + '% is below ' + globalThreshold + '%');
              failed = true;
            }
          }
          // Per-module thresholds for security-critical areas.
          const moduleThresholds = { 'src/app/api/auth': 70, 'src/app/api/verify': 70, 'src/lib/rate-limit': 70, 'src/lib/stellar': 65 };
          for (const [mod, threshold] of Object.entries(moduleThresholds)) {
            const key = Object.keys(summary).find(k => k.includes(mod));
            if (key && summary[key].lines.pct < threshold) {
              console.error(mod + ' line coverage ' + summary[key].lines.pct + '% is below module threshold of ' + threshold + '%');
              failed = true;
            }
          }
          if (failed) process.exit(1);
          console.log('All coverage thresholds met.');
          "

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn

  build:
    name: Frontend Build
    needs: lint-and-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Next.js Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          NEXT_PUBLIC_CREDENTIAL_NFT_CONTRACT: "CARWFW27MJ3OJADAUAHI3TDFHIL62YMLVEKTUTMSNXOMH7JJTNZKC3DK"
          NEXT_PUBLIC_CREDENTIAL_REGISTRY_CONTRACT: "CARWFW27MJ3OJADAUAHI3TDFHIL62YMLVEKTUTMSNXOMH7JJTNZKC3DK"
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          PINATA_JWT: "placeholder-pinata-jwt"
          NEXT_PUBLIC_PINATA_GATEWAY: "https://gateway.pinata.cloud"
          NEXT_PUBLIC_ENABLE_DEBUG_LOGS: "false"

      - name: Upload Production Build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next
          if-no-files-found: error

  browser-e2e:
    name: Browser E2E & A11y
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Download Production Build
        uses: actions/download-artifact@v7
        with:
          name: frontend-build
          path: frontend/.next

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E and A11y
        run: npm run test:browser
        env:
          CI: "true"
          NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder-service-role-key"
          NEXT_PUBLIC_CREDENTIAL_NFT_CONTRACT: "CARWFW27MJ3OJADAUAHI3TDFHIL62YMLVEKTUTMSNXOMH7JJTNZKC3DK"
          NEXT_PUBLIC_CREDENTIAL_REGISTRY_CONTRACT: "CARWFW27MJ3OJADAUAHI3TDFHIL62YMLVEKTUTMSNXOMH7JJTNZKC3DK"
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          PINATA_JWT: "placeholder-pinata-jwt"
          NEXT_PUBLIC_PINATA_GATEWAY: "https://gateway.pinata.cloud"
          NEXT_PUBLIC_ENABLE_DEBUG_LOGS: "false"

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore

      - name: Upload Playwright Traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: frontend/test-results
          if-no-files-found: ignore

  deploy-security-check:
    name: Post-Deploy Security Headers & Nonce Rotation
    needs: build
    if: github.event_name == 'push' && vars.PREVIEW_URL != ''
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.PREVIEW_URL }}
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Verify Security Headers
        run: bash scripts/check-security-headers.sh

      - name: Verify CSP Nonce Rotation
        run: |
          nonce_of() {
            curl -sI "$1" | tr -d '\r' | grep -i '^content-security-policy' | grep -o "'nonce-[^']*'" | head -n1
          }
          a=$(nonce_of "$BASE_URL/")
          b=$(nonce_of "$BASE_URL/api/health")
          c=$(nonce_of "$BASE_URL/")
          echo "nonces: $a | $b | $c"
          if [ -z "$a" ]; then echo "No CSP nonce found"; exit 1; fi
          if [ "$a" = "$c" ]; then echo "Nonce did not rotate between requests"; exit 1; fi

  smart-contracts:
    name: Soroban Contract Checks
    needs: secret-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./contracts

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
          rustup target add wasm32v1-none

      - name: Install Stellar CLI
        run: |
          # Download pre-built binary — avoids a 10-15 min cargo compile in CI.
          # soroban-sdk v29 requires stellar-cli >= v25.2.0.
          STELLAR_VERSION="30.0.1"
          curl -sL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Cache Cargo Dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build WASM
        run: cargo build --release --target wasm32v1-none

      - name: Run contract tests
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Record WASM SHA-256 digest
        id: wasm_digest
        run: |
          set -euo pipefail
          WASM=target/wasm32v1-none/release/acredia_stellar.wasm
          test -f "$WASM"
          DIGEST=$(sha256sum "$WASM" | cut -d' ' -f1)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$DIGEST" > wasm.sha256
          echo "WASM SHA-256: $DIGEST"

      - name: Upload WASM artifact and digest
        uses: actions/upload-artifact@v7
        with:
          name: certchain-wasm-${{ github.sha }}
          path: |
            contracts/target/wasm32v1-none/release/acredia_stellar.wasm
            contracts/wasm.sha256
          if-no-files-found: error
          retention-days: 90

