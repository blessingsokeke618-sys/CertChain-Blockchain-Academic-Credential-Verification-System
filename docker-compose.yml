# Standalone Stellar network for local CertChain contract development.
#
# Start once with `docker compose up -d`, then configure the `local` network
# in the Stellar CLI as described in docs/local-stellar-network.md.
# No testnet access or faucet is required after the image has been pulled.
services:
  stellar:
    image: stellar/quickstart:testing
    container_name: certchain-stellar-local
    command: --standalone --protocol-version 22 --limits unlimited
    ports:
      # Soroban RPC (http://127.0.0.1:8000/soroban/rpc)
      - "8000:8000"
      # Horizon (http://127.0.0.1:8001)
      - "8001:8001"
    environment:
      NETWORK_PASSPHRASE: "Standalone Network ; February 2017"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/soroban/rpc -X POST -H 'Content-Type: application/json' -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getLatestLedger\"}' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      # Keep the ledger between restarts; remove this volume for a fresh chain.
      - stellar-local-data:/home/stellar/.stellar
    restart: unless-stopped

volumes:
  stellar-local-data:
